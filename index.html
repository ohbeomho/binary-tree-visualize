<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Binary Tree Visualization</title>
        <style>
            body {
                margin: 0;
                padding: 0;
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
            }

            canvas {
                border: 1px solid black;
            }

            span#text-size {
                position: absolute;
                left: -999px;
                top: -999px;
                padding: 0;
                margin: 0;
                font-family: monospace;
                font-size: 16px;
            }
        </style>
    </head>

    <body>
        <canvas width="1000" height="1000"></canvas>
        <span id="text-size">a</span>
        <div>
            <input type="number" id="key-input" min="1" />
            <button id="insert">Insert</button>
            <button id="insert">Search</button>
            <button id="remove">Remove</button>
        </div>

        <script src="wasm_exec.js"></script>
        <script>
            const go = new Go();

            const levels = 10;
            let treeSize = 0;

            for (let i = 0; i <= levels; i++) treeSize += Math.pow(2, i);

            let treeAddr, treeInit, treeInsert, treeSearch;
            const getKey = (idx) => {
                if (!treeAddr) return -2;

                return go.mem.getInt32(treeAddr + idx * 4, true);
            };

            WebAssembly.instantiateStreaming(
                fetch("main.wasm"),
                go.importObject,
            ).then((result) => {
                go.run(result.instance);

                const exports = result.instance.exports;
                treeInit = exports.treeInit;
                treeInsert = exports.treeInsert;
                treeSearch = exports.treeSearch;

                treeAddr = treeInit(levels);
            });

            const canvas = document.querySelector("canvas");
            const ctx = canvas.getContext("2d");

            ctx.font = "16px monospace";

            const NODE_HEIGHT = 50;

            const nodes = [];

            const textSize = document.getElementById("text-size");
            const { width: textWidth, height: textHeight } =
                textSize.getBoundingClientRect();

            function drawTree() {
                if (!treeAddr) return;

                ctx.clearRect(0, 0, canvas.width, canvas.height);

                for (let node of nodes) {
                    const nodeTextWidth =
                        textWidth * String(getKey(node.idx)).length;
                    const nodeWidth = Math.max(
                        textWidth * (String(getKey(node.idx)).length + 2),
                        NODE_HEIGHT,
                    );

                    ctx.strokeRect(
                        node.x - nodeWidth / 2,
                        node.y - NODE_HEIGHT / 2,
                        nodeWidth,
                        NODE_HEIGHT,
                    );

                    ctx.fillText(
                        getKey(node.idx),
                        node.x - nodeTextWidth / 2,
                        node.y + 6,
                    );
                }
            }

            function updateNodes() {
                if (!treeAddr) return;

                nodes.splice(0, nodes.length);

                const getNode = (idx, x, y, level) => {
                    if (idx > treeSize || getKey(idx) === 0) return;

                    nodes.push({ idx, x, y });

                    getNode(
                        idx * 2,
                        x - canvas.width / Math.pow(2, level + 2),
                        y + NODE_HEIGHT * 3,
                        level + 1,
                    );
                    getNode(
                        idx * 2 + 1,
                        x + canvas.width / Math.pow(2, level + 2),
                        y + NODE_HEIGHT * 3,
                        level + 1,
                    );
                };

                getNode(1, canvas.width / 2, 50, 0);
            }

            function updatePosition(addX, addY) {
                if (!treeAddr) return;

                for (let node of nodes) {
                    node.x += addX;
                    node.y += addY;
                }
            }

            function insert() {
                if (!treeAddr) return;

                const key = keyInput.valueAsNumber;
                if (isNaN(key)) return;

                treeInsert(key);

                updateNodes();
                drawTree();
            }

            function search(key) {
                if (!treeAddr) return;

                // TODO: Highlight search path
            }

            function remove(key) {
                if (!treeAddr) return;

                const target = treeSearch(key);
                // TODO: Remove target key
            }

            const keyInput = document.getElementById("key-input");
            const insertButton = document.getElementById("insert");
            const searchButton = document.getElementById("search");
            const removeButton = document.getElementById("remove");

            keyInput.addEventListener("input", () => {
                const key = keyInput.valueAsNumber;
                if (isNaN(key)) return;

                if (key < 0) keyInput.value = "1";
            });

            insertButton.addEventListener("click", insert);
        </script>
    </body>
</html>
