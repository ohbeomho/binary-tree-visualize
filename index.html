<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Binary Tree Visualization</title>
        <style>
            body {
                margin: 0;
                padding: 2rem 0;
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                gap: 0.5rem;
            }

            canvas {
                border: 1px solid black;
            }

            span#text-size {
                position: absolute;
                left: -999px;
                top: -999px;
                padding: 0;
                margin: 0;
                font-family: monospace;
                font-size: 16px;
            }
        </style>
    </head>

    <body>
        <canvas width="1280" height="720"></canvas>
        <span id="text-size">a</span>
        <div>
            <input type="number" id="key-input" min="1" />
            <button id="insert">Insert</button>
            <button id="search">Search</button>
            <button id="remove">Remove</button>
        </div>
        <div>
            <button id="reset-camera">Reset Camera Position</button>
            <button id="clear-highlight">Clear Search Highlight</button>
        </div>

        <script src="wasm_exec.js"></script>
        <script>
            const go = new Go();

            const levels = 10;
            let treeSize = 0;

            for (let i = 0; i <= levels; i++) treeSize += Math.pow(2, i);

            let treeAddr, treeInit, treeInsert, treeSearch;
            const getKey = (idx) => {
                if (!treeAddr) return -2;

                return go.mem.getInt32(treeAddr + idx * 4, true);
            };

            WebAssembly.instantiateStreaming(
                fetch("main.wasm"),
                go.importObject,
            ).then((result) => {
                go.run(result.instance);

                const exports = result.instance.exports;
                treeInit = exports.treeInit;
                treeInsert = exports.treeInsert;
                treeSearch = exports.treeSearch;

                treeAddr = treeInit(levels);
            });

            const canvas = document.querySelector("canvas");
            const ctx = canvas.getContext("2d");

            ctx.font = "16px monospace";

            const NODE_HEIGHT = 50;

            const nodes = [],
                edges = [],
                highlighted = [];
            // nodeMap - (idx : node obj)
            // edgeMap - (idx : edge to parent)
            const nodeMap = new Map(),
                edgeMap = new Map();

            const textSize = document.getElementById("text-size");
            const { width: textWidth, height: textHeight } =
                textSize.getBoundingClientRect();

            let offsetX = 0,
                offsetY = 0;

            function drawTree() {
                if (!treeAddr) return;

                ctx.clearRect(0, 0, canvas.width, canvas.height);

                ctx.save();
                ctx.translate(offsetX, offsetY);

                for (let node of nodes) {
                    ctx.strokeRect(
                        node.x - node.width / 2,
                        node.y - NODE_HEIGHT / 2,
                        node.width,
                        NODE_HEIGHT,
                    );

                    const nodeTextWidth =
                        textWidth * String(getKey(node.idx)).length;

                    ctx.fillText(
                        getKey(node.idx),
                        node.x - nodeTextWidth / 2,
                        node.y + 6,
                    );
                }

                for (let edge of edges) {
                    const { parent, child, type } = edge;

                    ctx.beginPath();
                    ctx.moveTo(
                        parent.x +
                            (type === "left"
                                ? -(parent.width / 2)
                                : parent.width / 2),
                        parent.y + NODE_HEIGHT / 2,
                    );
                    ctx.lineTo(child.x, child.y - NODE_HEIGHT / 2);
                    ctx.stroke();
                }

                for (let h of highlighted) {
                    ctx.lineWidth = 3;
                    ctx.strokeStyle = "#167ef5";

                    if (h.highlightType === "node")
                        ctx.strokeRect(
                            h.x - h.width / 2,
                            h.y - NODE_HEIGHT / 2,
                            h.width,
                            NODE_HEIGHT,
                        );
                    else {
                        ctx.beginPath();
                        ctx.moveTo(
                            h.parent.x +
                                (h.type === "left"
                                    ? -(h.parent.width / 2)
                                    : h.parent.width / 2),
                            h.parent.y + NODE_HEIGHT / 2,
                        );
                        ctx.lineTo(h.child.x, h.child.y - NODE_HEIGHT / 2);
                        ctx.stroke();
                    }

                    ctx.lineWidth = 1;
                    ctx.strokeStyle = "black";
                }

                ctx.restore();
            }

            function highlightNode(idx) {
                if (!nodeMap.has(idx)) return;
                highlighted.push({
                    ...nodeMap.get(idx),
                    highlightType: "node",
                });
            }

            function highlightEdge(idx) {
                if (!edgeMap.has(idx)) return;
                highlighted.push({
                    ...edgeMap.get(idx),
                    highlightType: "edge",
                });
            }

            function clearHighlight() {
                highlighted.splice(0, highlighted.length);
            }

            function addOffset(x, y) {
                offsetX += x;
                offsetY += y;

                drawTree();
            }

            function updateNodes() {
                if (!treeAddr) return;

                nodes.splice(0, nodes.length);
                edges.splice(0, edges.length);

                const getNodes = (idx, x, y, level) => {
                    if (idx > treeSize || getKey(idx) === 0) return;

                    const node = {
                        idx,
                        x,
                        y,
                        width: Math.max(
                            textWidth * (String(getKey(idx)).length + 2),
                            NODE_HEIGHT,
                        ),
                    };

                    nodes.push(node);
                    nodeMap.set(idx, node);

                    const childXOffset = canvas.width / Math.pow(2, level + 2);
                    const leftX = x - childXOffset,
                        rightX = x + childXOffset,
                        childY = y + NODE_HEIGHT * 3;

                    getNodes(idx * 2, leftX, childY, level + 1);
                    getNodes(idx * 2 + 1, rightX, childY, level + 1);
                };

                const getEdges = (idx) => {
                    if (idx > treeSize || getKey(idx) === 0) return;
                    const currNode = nodeMap.get(idx),
                        parentIdx = Math.floor(idx / 2);

                    if (parentIdx > 0) {
                        const parentNode = nodeMap.get(parentIdx);
                        const edge = {
                            parent: parentNode,
                            child: currNode,
                            type:
                                getKey(idx) > getKey(parentIdx)
                                    ? "right"
                                    : "left",
                        };

                        edges.push(edge);
                        edgeMap.set(idx, edge);
                    }

                    getEdges(idx * 2);
                    getEdges(idx * 2 + 1);
                };

                getNodes(1, canvas.width / 2, 50, 0);
                getEdges(1);
            }

            function insert() {
                if (!treeAddr) return;

                const key = keyInput.valueAsNumber;
                if (isNaN(key)) return;

                treeInsert(key);

                updateNodes();
                drawTree();
            }

            function search() {
                if (!treeAddr) return;

                const key = keyInput.valueAsNumber;
                if (isNaN(key)) return;

                const result = treeSearch(key);

                if (result === -4) {
                    alert("Key not found");
                    return;
                }

                clearHighlight();
                let curr = result;
                while (curr >= 1) {
                    highlightNode(curr);
                    highlightEdge(curr);

                    curr = Math.floor(curr / 2);
                }

                drawTree();
            }

            function remove() {
                if (!treeAddr) return;

                const key = keyInput.valueAsNumber;
                if (isNaN(key)) return;

                const target = treeSearch(key);

                // TODO: Remove target key

                clearHighlight();
                updateNodes();
                drawTree();
            }

            const keyInput = document.getElementById("key-input");
            const insertButton = document.getElementById("insert"),
                searchButton = document.getElementById("search"),
                removeButton = document.getElementById("remove");
            const resetCameraButton = document.getElementById("reset-camera"),
                clearHighlightButton =
                    document.getElementById("clear-highlight");

            keyInput.addEventListener("input", () => {
                const key = keyInput.valueAsNumber;
                if (isNaN(key)) return;

                if (key < 0) keyInput.value = "1";
            });

            insertButton.addEventListener("click", insert);
            searchButton.addEventListener("click", search);
            removeButton.addEventListener("click", remove);

            const mouseDown = {};
            let mousePos = { x: null, y: null };
            canvas.addEventListener(
                "mousedown",
                (e) => (mouseDown[e.button] = true),
            );
            canvas.addEventListener(
                "mouseup",
                (e) => (mouseDown[e.button] = false),
            );
            canvas.addEventListener("contextmenu", (e) => e.preventDefault());
            canvas.addEventListener("mousemove", (e) => {
                const { x: prevX, y: prevY } = mousePos;
                let currX = e.clientX,
                    currY = e.clientY;

                mousePos.x = currX;
                mousePos.y = currY;

                if (!mouseDown[0] || prevX === null) return;

                addOffset(currX - prevX, currY - prevY);
            });

            resetCameraButton.addEventListener("click", () =>
                addOffset(-offsetX, -offsetY),
            );
            clearHighlightButton.addEventListener("click", () => {
                clearHighlight();
                drawTree();
            });
        </script>
    </body>
</html>
